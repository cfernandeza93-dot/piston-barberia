<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Píston Barbería</title>
<link rel="stylesheet" href="css/app.css?v=202611201359">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>✂ Píston Barbería</h1>
    <p>Sistema de gestión interno</p>
    <input type="password" id="pwInput" placeholder="Contraseña de acceso" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">Ingresar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- OVERLAY -->
<div id="overlay"><div class="spinner"></div></div>
<div id="toast-container"></div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">✂ PÍSTON BARBERÍA</div>
      <div class="topbar-subtitle">Sistema de Gestión</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="topbarDate" style="font-size:11px;color:#94A3B8"></span>
      <button onclick="descargarRespaldo()" title="Descargar una copia de todos los datos" style="padding:5px 10px;background:transparent;color:#CBD5E1;border:1px solid #475569;border-radius:6px;font-size:11px;cursor:pointer">💾 Respaldo</button>
      <button onclick="logout()" title="Cerrar sesión en este equipo" style="padding:5px 10px;background:transparent;color:#CBD5E1;border:1px solid #475569;border-radius:6px;font-size:11px;cursor:pointer">Salir</button>
    </div>
  </div>
  <div class="tabs" id="tabBar">
    <button class="tab-btn active" onclick="go('dashboard')">📊 Dashboard</button>
    <button class="tab-btn" onclick="go('venta')">➕ Nueva Venta</button>
    <button class="tab-btn" onclick="go('propuestas')">📝 Propuestas</button>
    <button class="tab-btn" onclick="go('historial')">📋 Historial</button>
    <button class="tab-btn" onclick="go('inventario')">📦 Inventario</button>
    <button class="tab-btn" onclick="go('gastos')">💸 Gastos</button>
    <button class="tab-btn" onclick="go('conciliacion')">🔄 Conciliación</button>
    <button class="tab-btn" onclick="go('equipo')">👥 Equipo</button>
    <button class="tab-btn" onclick="go('arqueo')">🏦 Arqueo Caja</button>
    <!-- <button class="tab-btn" onclick="go('giftcards')">🎁 Gift Cards</button> -->
    <button class="tab-btn" onclick="go('analisis')">📈 Análisis</button>
    <button class="tab-btn" onclick="go('liquidacion')">💰 Liquidación</button>
    <button class="tab-btn" onclick="go('importar')">📥 Importar</button>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<!-- BRIDGE -->
<script>
window._bridge = {};
['checkPw','logout','descargarRespaldo','go','dshTab','loadDashboard','loadVenta','loadHistorial','loadInventario','loadGastos','loadConciliacion','loadEquipo','loadImportar','loadArqueo','loadAnalisis','loadLiquidacion','loadGiftCards',
 'submitVenta','addCartItem','removeCartItem','clearCart',
 'filtrarProductos','seleccionarProducto','limpiarSeleccionProducto',
 'filterHistorial','deleteVenta','startEditVenta','saveEditVenta','cancelEditVenta','exportHistorialCSV',
 'saveProducto','deleteProducto','startEditProducto','saveEditProducto','cancelEditProducto',
 'saveGasto','deleteGasto','startEditGasto','saveEditGasto','cancelEditGasto',
 'processConcilFile','exportConcilErrors',
 'saveBarbero','deleteBarbero','startEditBarbero','saveEditBarbero','cancelEditBarbero',
 'saveServicio','deleteServicio','startEditServicio','saveEditServicio','cancelEditServicio',
 'ventaFechaChange','ventaTipoChange','ventaFormaPagoChange','ventaServicioChange','ventaEsWebChange',
 'processImportFile','confirmImport','cancelImport',
 'concilSetAnio','concilSetMes','runConciliacion',
 'arqueoExportCSV','saveSaldoInicial','saveSaldoFinal','propagarSiguienteMes','gastoSetTab','gastoSetAnio','gastoSetMes',
 'gcPreview','gcSave','gcDescargarPNG','gcDescargarPDF','gcCanjear','gcDeleteCard'
].forEach(fn=>{
  window[fn]=function(){return window._bridge[fn]&&window._bridge[fn](...arguments)};
});
</script>

<!-- Módulos de la app (carpeta js/). El ?v= evita que el navegador mezcle versiones viejas y nuevas
     después de publicar: se actualiza con  node tools/bump-version.mjs -->
<script type="importmap">
{
  "imports": {
    "./js/agenda.js": "./js/agenda.js?v=202611201359",
    "./js/analisis.js": "./js/analisis.js?v=202611201359",
    "./js/analisis_logic.js": "./js/analisis_logic.js?v=202611201359",
    "./js/analisis_totales.js": "./js/analisis_totales.js?v=202611201359",
    "./js/arqueo.js": "./js/arqueo.js?v=202611201359",
    "./js/conciliacion.js": "./js/conciliacion.js?v=202611201359",
    "./js/core.js": "./js/core.js?v=202611201359",
    "./js/dashboard.js": "./js/dashboard.js?v=202611201359",
    "./js/equipo.js": "./js/equipo.js?v=202611201359",
    "./js/gastos.js": "./js/gastos.js?v=202611201359",
    "./js/giftcards.js": "./js/giftcards.js?v=202611201359",
    "./js/historial.js": "./js/historial.js?v=202611201359",
    "./js/importar.js": "./js/importar.js?v=202611201359",
    "./js/inventario.js": "./js/inventario.js?v=202611201359",
    "./js/liquidacion.js": "./js/liquidacion.js?v=202611201359",
    "./js/main.js": "./js/main.js?v=202611201359",
    "./js/propuestas.js": "./js/propuestas.js?v=202611201359",
    "./js/propuestas_logic.js": "./js/propuestas_logic.js?v=202611201359",
    "./js/venta.js": "./js/venta.js?v=202611201359"
  }
}
</script>
<script type="module" src="./js/main.js?v=202611201359"></script>
</body>
</html>
